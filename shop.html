<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recipe Syllabus | Shop</title>
  <link rel="icon" type="image/png" href="images/recipe-syllabus-favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@500&family=Karla:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- Supabase JavaScript client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
  :root {
    --paper: #EDEFE6;
    --paper-dim: #E3E6D8;
    --ink: #22302A;
    --marigold: #E8A33D;
    --chalk: #4C6B8A;
    --line: #D2D2C2;
    --dark: #1B2621;
    --header-bg: #F7F1E2;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(232,163,61,0.08), transparent 28%),
      linear-gradient(180deg, #E3E6D8 0%, #EDEFE6 45%, #EDEFE6 100%);
    color: var(--ink);
    font-family: "Karla", Arial, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  img {
    max-width: 100%;
    display: block;
  }

  /* HEADER */
  /* HEADER — MATCH INDEX.HTML */

header.site {
  position: sticky;
  top: 0;
  z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(247, 241, 226, 0.96);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}

header.site nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  max-width: 1120px;
  margin: 0 auto;
}

/* LEFT BRAND */
.shop-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.shop-logo {
  display: block;
  object-fit: contain;
  flex-shrink: 0;
}

.shop-logo-main {
  width: 78px;
  height: 54px;
}

.shop-logo-sheeja {
  width: 62px;
  height: 54px;
}

.shop-brand-text {
  line-height: 1.1;
  white-space: nowrap;
}

.shop-brand-name {
  font-family: "Newsreader", Georgia, serif;
  font-size: 1.35rem;
  font-weight: 500;
  color: var(--ink);
}

.shop-brand-subtitle {
  margin-top: 5px;
  font-family: "Karla", Arial, sans-serif;
  font-size: 0.82rem;
  color: #657168;
}

/* RIGHT NAV */
.nav-collapsible {
  display: flex;
  align-items: center;
  gap: 32px;
}

.nav-links {
  display: flex;
  gap: 30px;
  list-style: none;
  font-size: 0.95rem;
}

.nav-links a {
  text-decoration: none;
  color: var(--ink);
  transition: color 0.2s ease;
}

.nav-links a:hover {
  color: var(--chalk);
}

/* MOBILE */
@media (max-width: 850px) {

  header.site nav {
    padding: 14px 18px;
  }

  .shop-brand {
    gap: 9px;
  }

  .shop-logo-main {
    width: 62px;
    height: 46px;
  }

  .shop-logo-sheeja {
    width: 50px;
    height: 46px;
  }

  .shop-brand-name {
    font-size: 1.1rem;
  }

  .shop-brand-subtitle {
    font-size: 0.72rem;
  }

  .nav-links {
    gap: 15px;
    font-size: 0.82rem;
  }
}

@media (max-width: 650px) {

  .nav-links {
    display: none;
  }

  .shop-brand-name {
    font-size: 1.05rem;
  }

  .shop-brand-subtitle {
    font-size: 0.7rem;
  }
}
  

  /* MAIN */
  .container {
    max-width: 1120px;
    margin: 0 auto;
    padding: 64px 24px 78px;
  }

  .shop-title {
    margin-bottom: 44px;
  }

  .shop-title h2 {
    margin: 0 0 10px;
    font-family: "Newsreader", Georgia, serif;
    font-size: clamp(2rem, 3.2vw, 2.6rem);
    font-weight: 500;
    color: var(--ink);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .shop-title p {
    margin: 0;
    color: #3C4A42;
    font-size: 1rem;
  }

  /* PRODUCT GRID */
  #products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 28px;
  }

  /* PRODUCT CARD */
  .product-card {
    background: var(--header-bg);
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    box-shadow: none;
    transition:
      transform 0.2s ease,
      border-color 0.2s ease;
  }

  .product-card:hover {
    transform: translateY(-3px);
    border-color: var(--chalk);
  }

  /* IMAGE */
  .product-image {
    width: 100%;
    height: 230px;
    object-fit: cover;
    background: var(--paper-dim);
  }

  /* CONTENT */
  .product-content {
    padding: 22px;
  }

  .product-name {
    margin-bottom: 8px;
    font-family: "Newsreader", Georgia, serif;
    font-size: 1.45rem;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.1;
  }

  .product-description {
    min-height: 48px;
    color: #3C4A42;
    line-height: 1.55;
  }

  .product-price {
    margin: 18px 0 6px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--ink);
  }

  .stock {
    margin-bottom: 18px;
    color: #657168;
    font-size: 0.88rem;
    font-family: "IBM Plex Mono", monospace;
  }

  /* BUY BUTTON */
  .buy-button {
    width: 100%;
    border: 0;
    border-radius: 2px;
    padding: 14px 20px;
    background: #F0C860;
    color: var(--dark);
    font-family: "Karla", Arial, sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition:
      background 0.2s ease,
      color 0.2s ease;
  }
  
  .buy-button:hover {
    background: var(--paper);
    color: var(--ink);
  }

  .buy-button:disabled {
    background: #A7AEA7;
    color: #EDEFE6;
    cursor: not-allowed;
  }

  /* MESSAGE */
  #message {
    text-align: center;
    padding: 30px;
    color: #657168;
  }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--line);
    padding: 30px 24px;
    text-align: center;
    color: #657168;
    font-size: 0.85rem;
    background: var(--paper);
  }

  /* ACCESSIBILITY */
  :focus-visible {
    outline: 2px solid var(--chalk);
    outline-offset: 3px;
  }

  /* MOBILE */
  @media (max-width: 650px) {
    .container {
      padding: 46px 18px 60px;
    }

    .shop-title {
      margin-bottom: 32px;
    }

    #products {
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .product-image {
      height: 220px;
    }
  }
</style>
</head>

<body>

<header class="site">
  <nav id="mainNav">

    <!-- LEFT BRAND -->
    <div class="shop-brand">

      <img
        src="images/RecipeSyllabusLogo.png"
        alt="Recipe Syllabus"
        class="shop-logo shop-logo-main"
      >

      <img
        src="images/sheeja-eapen-logo.png"
        alt="Sheeja Eapen"
        class="shop-logo shop-logo-sheeja"
      >

      <div class="shop-brand-text">
        <div class="shop-brand-name">Recipe Syllabus</div>
        <div class="shop-brand-subtitle">Homemade Products</div>
      </div>

    </div>

    <!-- RIGHT NAVIGATION -->
    <div class="nav-collapsible">
      <ul class="nav-links">
        <li><a href="index.html#work">Videos</a></li>
        <li><a href="index.html#teaching">Teaching</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </div>

  </nav>
</header>

<div class="container">

  <div class="shop-title">
    <h2>🛒 Shop</h2>
    <p>Our homemade products</p>
  </div>

  <div id="message">Loading products...</div>

  <div id="products"></div>

</div>

<footer>
  © Recipe Syllabus
</footer>

<script>
  // =========================================================
  // SUPABASE CONNECTION
  // =========================================================

  const SUPABASE_URL = "https://nuipcuxyebsvnlxucjfk.supabase.co";

  // IMPORTANT:
  // Replace the value below with your Supabase PUBLISHABLE KEY.
  // Do NOT use the sb_secret_ key.
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_S5U1KWrJEGYccqpmMXgTKw_g9YWevf2";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // =========================================================
  // LOAD PRODUCTS
  // =========================================================

  async function loadProducts() {

    const message = document.getElementById("message");
    const productsContainer = document.getElementById("products");

    const { data, error } = await db
      .from("products")
      .select("*")
      .eq("is_active", true)
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);

      message.textContent =
        "Unable to load products. Please try again later.";

      return;
    }

    message.style.display = "none";

    if (!data || data.length === 0) {
      message.style.display = "block";
      message.textContent = "No products available at the moment.";
      return;
    }

    productsContainer.innerHTML = "";

    data.forEach(product => {

      const card = document.createElement("div");
      card.className = "product-card";

      const image = product.image_url
        ? `<img class="product-image"
                src="${escapeHtml(product.image_url)}"
                alt="${escapeHtml(product.name)}">`
        : `<div class="product-image"
                style="display:flex;align-items:center;justify-content:center;">
                <span>No image</span>
           </div>`;

      const soldOut = product.stock_quantity <= 0;

      card.innerHTML = `
        ${image}

        <div class="product-content">

          <div class="product-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="product-description">
            ${escapeHtml(product.description || "")}
          </div>

          <div class="product-price">
            ₹${Number(product.price).toFixed(2)}
          </div>

          <div class="stock">
            ${soldOut
              ? "Out of stock"
              : `${product.stock_quantity} available`}
          </div>

          <button
            class="buy-button"
            ${soldOut ? "disabled" : ""}
            onclick="buyProduct(${product.id})">
            ${soldOut ? "Out of Stock" : "BUY NOW"}
          </button>

        </div>
      `;

      productsContainer.appendChild(card);
    });
  }


  // =========================================================
  // BUY BUTTON
  // =========================================================

  function buyProduct(productId) {

    // For now we only demonstrate the product selection.
    // The next step will replace this with the customer
    // order form and Supabase order creation.

    window.location.href =
      "order.html?product_id=" + encodeURIComponent(productId);
  }


  // =========================================================
  // BASIC HTML ESCAPING
  // =========================================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // Start
  loadProducts();

</script>

</body>
</html>
