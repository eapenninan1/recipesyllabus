<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order | Recipe Syllabus</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf5;
      color: #222;
    }
    header {
      background: #963434;
      color: white;
      text-align: center;
      padding: 14px 10px;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 4px 0 0; font-size: 13px; }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 16px 40px;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    h2 { margin-top: 0; }

    .product {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .product img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product-info { flex: 1; min-width: 220px; }
    .price { font-size: 22px; font-weight: bold; color: #963434; }
    .stock { color: #555; font-size: 14px; margin-top: 6px; }

    label {
      display: block;
      font-weight: bold;
      margin: 13px 0 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea { min-height: 90px; resize: vertical; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .summary {
      border-top: 1px solid #ddd;
      margin-top: 20px;
      padding-top: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      color: #963434;
      border-top: 1px solid #ddd;
      padding-top: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #963434;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .error {
      display: block;
      background: #ffe8e8;
      color: #a00000;
    }

    .info {
      display: block;
      background: #fff3d6;
      color: #704d00;
    }

    @media (max-width: 650px) {
      .grid { grid-template-columns: 1fr; }
      .product img { width: 100%; height: 200px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Recipe Syllabus</h1>
    <p>Homemade Products</p>
  </header>

  <main>
    <div class="box">
      <h2>🛒 Your Order</h2>
      <div id="productArea">Loading product...</div>
    </div>

    <div class="box">
      <h2>Delivery Details</h2>

      <form id="orderForm">
        <div class="grid">
          <div>
            <label for="name">Full Name *</label>
            <input id="name" name="name" required>
          </div>

          <div>
            <label for="phone">Mobile Number *</label>
            <input id="phone" name="phone" type="tel" inputmode="numeric"
                   pattern="[0-9+\-\s]{10,15}" required>
          </div>
        </div>

        <label for="email">Email</label>
        <input id="email" name="email" type="email">

        <label for="address">Full Delivery Address *</label>
        <textarea id="address" name="address" required
                  placeholder="House/Flat, Street, Area"></textarea>

        <div class="grid">
          <div>
            <label for="city">City *</label>
            <input id="city" name="city" required>
          </div>

          <div>
            <label for="state">State *</label>
            <input id="state" name="state" required>
          </div>
        </div>

        <label for="pincode">PIN Code *</label>
        <input id="pincode" name="pincode" inputmode="numeric"
               pattern="[0-9]{6}" maxlength="6" required>

        <label for="quantity">Quantity *</label>
        <input id="quantity" name="quantity" type="number"
               min="1" value="1" required>

        <div class="summary">
          <div class="summary-row">
            <span>Product</span>
            <span id="summaryProduct">—</span>
          </div>
          <div class="summary-row">
            <span>Quantity</span>
            <span id="summaryQuantity">1</span>
          </div>
          <div class="summary-row">
            <span>Product total</span>
            <span id="summarySubtotal">₹0.00</span>
          </div>
          <div class="summary-row">
            <span>Delivery</span>
            <span>Calculated at next step</span>
          </div>
          <div class="summary-row total">
            <span>Product total</span>
            <span id="summaryTotal">₹0.00</span>
          </div>
        </div>

        <button id="continueButton" type="submit">
          Continue to Payment
        </button>

        <div id="message" class="message"></div>
      </form>
    </div>
  </main>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // IMPORTANT:
    // Use the same Supabase URL and publishable key as shop.html.
    const SUPABASE_URL = "https://nuipcuxyebsvnlxucjfk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_S5U1KWrJEGYccqpmMXgTKw_g9YWevf2";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("product_id");

    let product = null;

    const productArea = document.getElementById("productArea");
    const quantityInput = document.getElementById("quantity");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function money(value) {
      return "₹" + Number(value).toFixed(2);
    }

    function updateSummary() {
      if (!product) return;

      let quantity = parseInt(quantityInput.value, 10) || 1;
      if (quantity < 1) quantity = 1;

      const subtotal = Number(product.price) * quantity;

      document.getElementById("summaryProduct").textContent = product.name;
      document.getElementById("summaryQuantity").textContent = quantity;
      document.getElementById("summarySubtotal").textContent = money(subtotal);
      document.getElementById("summaryTotal").textContent = money(subtotal);
    }

    async function loadProduct() {
      if (!productId) {
        productArea.innerHTML = "<p>No product was selected.</p>";
        document.getElementById("continueButton").disabled = true;
        return;
      }

      const { data, error } = await db
        .from("products")
        .select("*")
        .eq("id", productId)
        .eq("is_active", true)
        .single();

      if (error || !data) {
        console.error("Product loading error:", error);
        productArea.innerHTML =
          "<p>Unable to load this product. Please return to the Shop.</p>";
        document.getElementById("continueButton").disabled = true;
        return;
      }

      product = data;

      const image = product.image_url
        ? `<img src="${product.image_url}" alt="${product.name}">`
        : `<div style="width:130px;height:130px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;color:#777;">No image</div>`;

      productArea.innerHTML = `
        <div class="product">
          ${image}
          <div class="product-info">
            <h3>${product.name}</h3>
            <p>${product.description || ""}</p>
            <div class="price">${money(product.price)}</div>
            <div class="stock">Available stock: ${product.stock_quantity}</div>
          </div>
        </div>
      `;

      quantityInput.max = product.stock_quantity;
      updateSummary();
    }

    quantityInput.addEventListener("input", updateSummary);

    document.getElementById("orderForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      if (!product) {
        showMessage("Product information is not available.", "error");
        return;
      }

      const quantity = parseInt(quantityInput.value, 10);

      if (!quantity || quantity < 1) {
        showMessage("Please enter a valid quantity.", "error");
        return;
      }

      if (quantity > product.stock_quantity) {
        showMessage("The requested quantity is greater than available stock.", "error");
        return;
      }

      const button = document.getElementById("continueButton");
      button.disabled = true;
      button.textContent = "Creating order...";
      message.className = "message";
      message.style.display = "none";

      const payload = {
        product_id: product.id,
        quantity: quantity,
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        address: document.getElementById("address").value.trim(),
        city: document.getElementById("city").value.trim(),
        state: document.getElementById("state").value.trim(),
        pincode: document.getElementById("pincode").value.trim()
      };

      try {
        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/create-order`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_PUBLISHABLE_KEY,
              "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
            },
            body: JSON.stringify(payload)
          }
        );

        const result = await response.json();

if (!response.ok || !result.success) {
  console.error("Create order error:", result);
  throw new Error(result.error || "Unable to create order");
}

// Database order has been created.
// Now create the Razorpay payment order.
const paymentResponse = await fetch(
  `${SUPABASE_URL}/functions/v1/create-payment-order`,
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_PUBLISHABLE_KEY,
      "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
    },
    body: JSON.stringify({
      order_id: result.order_id,
      order_number: result.order_number
    })
  }
);

const paymentResult = await paymentResponse.json();

console.log("create-payment-order:", paymentResult);

if (!paymentResponse.ok) {
  throw new Error(
    paymentResult.error ||
    "Unable to create Razorpay payment order"
  );
}

const razorpayOrderId =
  paymentResult.razorpay_order_id ||
  paymentResult.order_id;

const razorpayAmount =
  paymentResult.amount;

const razorpayCurrency =
  paymentResult.currency || "INR";

const razorpayKey =
  paymentResult.key_id ||
  paymentResult.razorpay_key_id;

if (!razorpayOrderId) {
  throw new Error("Razorpay order ID was not returned.");
}

if (!razorpayKey) {
  throw new Error("Razorpay Key ID was not returned.");
}

// Open Razorpay Checkout
const options = {
  key: razorpayKey,
  amount: Number(razorpayAmount),
  currency: razorpayCurrency,
  name: "Recipe Syllabus",
  description: product.name,
  order_id: razorpayOrderId,

  prefill: {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    contact: document.getElementById("phone").value.trim()
  },

  handler: async function(payment) {

    console.log("Razorpay payment:", payment);

    // Send payment details to verify-payment
    const verifyResponse = await fetch(
      `${SUPABASE_URL}/functions/v1/verify-payment`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
        },
        body: JSON.stringify({
          order_id: result.order_id,
          order_number: result.order_number,
          razorpay_order_id: payment.razorpay_order_id,
          razorpay_payment_id: payment.razorpay_payment_id,
          razorpay_signature: payment.razorpay_signature
        })
      }
    );

      const verifyResult = await verifyResponse.json();
  
      console.log("verify-payment:", verifyResult);
  
      if (!verifyResponse.ok || !verifyResult.success) {
        throw new Error(
          verifyResult.error ||
          "Payment verification failed"
        );
      }
  
      showMessage(
        "Payment successful! Your order has been confirmed.",
        "success"
      );
  
      button.textContent = "Payment Successful";
      button.disabled = true;
    }
  };
  
  const razorpay = new Razorpay(options);
  
  razorpay.open();
      } catch (error) {
        console.error("Order submission error:", error);
        showMessage(error.message || "Unable to create order. Please try again.", "error");
        button.disabled = false;
        button.textContent = "Continue to Payment";
      }
    });

    loadProduct();
  </script>
</body>
</html>
