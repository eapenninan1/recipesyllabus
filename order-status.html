<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Syllabus | Track Order</title>
  <link rel="icon" type="image/png" href="images/recipe-syllabus-favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #EDEFE6;
      --paper-dim: #E3E6D8;
      --ink: #22302A;
      --chalk: #4C6B8A;
      --line: #D2D2C2;
      --dark: #1B2621;
      --header-bg: #F7F1E2;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Karla", Arial, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    header.site {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(247, 241, 226, 0.96);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--line);
    }

    header.site nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      max-width: 1120px;
      margin: 0 auto;
    }

    .shop-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      min-width: 0;
    }

    .logo-mark {
      height: 54px;
      width: auto;
      display: block;
      flex-shrink: 0;
    }

    .logo-mark-secondary {
      height: 54px;
      width: 54px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .shop-brand-text {
      margin-left: 4px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .shop-brand-name {
      font-family: "Newsreader", Georgia, serif;
      font-size: 1.2rem;
      font-weight: 500;
    }

    .shop-brand-subtitle {
      margin-top: 5px;
      font-size: 0.82rem;
      color: #657168;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
      font-size: 0.95rem;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--ink);
    }

    .nav-links a:hover { color: var(--chalk); }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px 78px;
    }

    .box {
      background: var(--header-bg);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 28px;
      margin-bottom: 24px;
    }

    h2, h3 {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.1;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
    }

    h3 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin: 14px 0 6px;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #FBFAF4;
      color: var(--ink);
      font-family: "Karla", Arial, sans-serif;
      font-size: 16px;
      outline: none;
    }

    input:focus { border-color: var(--chalk); }

    button {
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 2px;
      background: #F0C860;
      color: var(--dark);
      font-family: "Karla", Arial, sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 18px;
    }

    button:hover {
      background: var(--paper);
      color: var(--ink);
    }

    button:disabled {
      background: #A7AEA7;
      color: #EDEFE6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 2px;
      display: none;
    }

    .error {
      display: block;
      background: #F4E0DC;
      color: #8A3027;
      border: 1px solid #D9AAA1;
    }

    .success {
      display: block;
      background: #E1EBDD;
      color: #31553B;
      border: 1px solid #B7C9B4;
    }

    .info {
      display: block;
      background: #F5EACB;
      color: #70551B;
      border: 1px solid #E0CB8F;
    }

    .status-card {
      margin-top: 24px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 10px 0;
    }

    .status-row span:last-child {
      text-align: right;
      font-family: "IBM Plex Mono", monospace;
    }

    .status-main {
      font-family: "Newsreader", Georgia, serif;
      font-size: 1.55rem;
      margin-bottom: 16px;
    }

    .muted {
      color: #657168;
      font-size: 0.9rem;
    }

    .hidden { display: none; }

    @media (max-width: 650px) {
      header.site nav { padding: 14px 18px; }
      .logo-mark { height: 44px; }
      .logo-mark-secondary { height: 44px; width: 44px; }
      .shop-brand-name { font-size: 1rem; }
      .shop-brand-subtitle { font-size: 0.7rem; }
      .nav-links { display: none; }
      main { padding: 46px 18px 60px; }
      .box { padding: 22px; }
      .status-row { flex-direction: column; gap: 2px; }
      .status-row span:last-child { text-align: left; }
    }
  </style>
</head>

<body>
  <header class="site">
    <nav>
      <a href="index.html" class="shop-brand">
        <img src="images/RecipeSyllabusLogo.png" alt="Recipe Syllabus logo" class="logo-mark">
        <img src="images/sheeja-eapen-logo.png" alt="Sheeja Eapen logo" class="logo-mark-secondary">
        <div class="shop-brand-text">
          <div class="shop-brand-name">Recipe Syllabus</div>
          <div class="shop-brand-subtitle">Homemade Products</div>
        </div>
      </a>

      <ul class="nav-links">
        <li><a href="index.html#work">Videos</a></li>
        <li><a href="index.html#teaching">Teaching</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="box">
      <h2>Track Your Order</h2>

      <p class="muted">
        Enter your order number and the mobile number used when placing the order.
      </p>

      <form id="statusForm">
        <label for="orderNumber">Order Number</label>
        <input
          id="orderNumber"
          autocomplete="off"
          placeholder="Example: RS-XXXXXXXX"
          required
        >

        <label for="phone">Mobile Number</label>
        <input
          id="phone"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          placeholder="Mobile number used for the order"
          required
        >

        <button id="lookupButton" type="submit">
          Track Order
        </button>

        <div id="message" class="message"></div>
      </form>
    </div>

    <div id="resultBox" class="box hidden">
      <h2>Order Status</h2>

      <div class="status-main" id="mainStatus">—</div>

      <div class="status-card">
        <div class="status-row">
          <span>Order Number</span>
          <span id="resultOrderNumber">—</span>
        </div>

        <div class="status-row">
          <span>Payment</span>
          <span id="resultPayment">—</span>
        </div>

        <div class="status-row">
          <span>Fulfilment</span>
          <span id="resultFulfilment">—</span>
        </div>

        <div class="status-row">
          <span>Amount</span>
          <span id="resultAmount">—</span>
        </div>

        <div class="status-row hidden" id="courierRow">
          <span>Courier</span>
          <span id="resultCourier">—</span>
        </div>

        <div class="status-row hidden" id="trackingRow">
          <span>Tracking</span>
          <span id="resultTracking">—</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://nuipcuxyebsvnlxucjfk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_S5U1KWrJEGYccqpmMXgTKw_g9YWevf2";

    const form = document.getElementById("statusForm");
    const button = document.getElementById("lookupButton");
    const message = document.getElementById("message");
    const resultBox = document.getElementById("resultBox");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function money(value) {
      return "₹" + Number(value || 0).toFixed(2);
    }

    function paymentLabel(status) {
      switch (status) {
        case "paid":
        case "captured":
          return "Paid";
        case "cancelled":
          return "Cancelled";
        case "created":
          return "Payment Pending";
        default:
          return status || "Unknown";
      }
    }

    function fulfilmentLabel(status) {
      if (!status) return "Order received";

      switch (String(status).toLowerCase()) {
        case "ready":
        case "ready_to_ship":
          return "Ready to ship";
        case "packed":
          return "Packed";
        case "shipped":
          return "Shipped";
        case "delivered":
          return "Delivered";
        case "cancelled":
          return "Not for dispatch";
        default:
          return status;
      }
    }

    function mainStatus(order) {
      if (order.payment_status === "cancelled") {
        return "Payment Cancelled";
      }

      if (
        order.payment_status !== "paid" &&
        order.payment_status !== "captured"
      ) {
        return "Payment Pending";
      }

      if (order.fulfillment_status) {
        return fulfilmentLabel(order.fulfillment_status);
      }

      return "Order Received";
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const orderNumber =
        document.getElementById("orderNumber").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      if (!orderNumber || !phone) {
        showMessage(
          "Please enter your order number and mobile number.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Checking...";
      resultBox.classList.add("hidden");
      message.className = "message";

      try {
        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/get-order-status`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_PUBLISHABLE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
            },
            body: JSON.stringify({
              order_number: orderNumber,
              phone: phone
            })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success || !result.order) {
          throw new Error(
            result.error || "Order not found."
          );
        }

        const order = result.order;

        document.getElementById("mainStatus").textContent =
          mainStatus(order);

        document.getElementById("resultOrderNumber").textContent =
          order.order_number || "—";

        document.getElementById("resultPayment").textContent =
          paymentLabel(order.payment_status);

        document.getElementById("resultFulfilment").textContent =
          order.payment_status === "cancelled"
            ? "Not for dispatch"
            : fulfilmentLabel(order.fulfillment_status);

        document.getElementById("resultAmount").textContent =
          money(order.total_amount);

        const courierRow =
          document.getElementById("courierRow");

        const trackingRow =
          document.getElementById("trackingRow");

        if (
          order.payment_status === "paid" &&
          order.courier_name
        ) {
          document.getElementById("resultCourier").textContent =
            order.courier_name;

          courierRow.classList.remove("hidden");
        } else {
          courierRow.classList.add("hidden");
        }

        if (
          order.payment_status === "paid" &&
          order.tracking_number
        ) {
          document.getElementById("resultTracking").textContent =
            order.tracking_number;

          trackingRow.classList.remove("hidden");
        } else {
          trackingRow.classList.add("hidden");
        }

        resultBox.classList.remove("hidden");

        showMessage(
          "Order found.",
          "success"
        );

      } catch (error) {
        console.error("Order status error:", error);

        showMessage(
          error.message || "Unable to find the order.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Track Order";
      }
    });
  </script>
</body>
</html>
